# =============================================================================
# config.yaml — Naimi/Kang-Schafer nuisance-learner simulation study
# (manuscript simulation (1))
#
# config for all three sample sizes (200 / 1200 / 5000).
# Select the sample size at run time:  Rscript 01_generate_dgp_data.R --n 1200
# =============================================================================

# --- Data-generating process (Kang & Schafer 2007, as adapted by Naimi et al. 2023) ---
dgp:
  beta_a: [-1, 0.559615787935423, 0.559615787935423, 0.559615787935423, 0.559615787935423]  # log(1.75)
  beta_y: [120, 3, 3, 3, 3]
  true_ate: 6
  error_sd: 6

# --- Simulation settings ---
simulation:
  sample_sizes: [200, 1200, 5000]   # supported --n values
  n_sims: 200                       # replicates per cell
  starting_seed: 1                  # data seed = starting_seed + sim_id
  scenarios:
    - simple                        # C1-C4 (correct specification possible w/ parametric model)
    - complex                       # analyst sees Z1-Z4 transforms only (parametric misspecification scenario)

# --- Estimation settings ---
estimation:
  # Propensity truncation applied inside every learner before any estimator runs
  pi_bounds: [0.025, 0.975]
  # Cross-fitting folds and learner-internal CV folds, by sample size.
  folds_by_n:
    "200": 10
    "1200": 5
    "5000": 5
  cross_fit_options: [false, true]
  # The manuscript's "HAL" is the only sample-size dependent variant, due to prohibitive run time
  hal_by_n:
    "200": hal_discrete
    "1200": hal_discrete
    "5000": hal_n5000

# --- Estimators (all four consume same nuisances) ---
estimators: [ipw, gcomp, aipw, tmle]

# --- Nuisance learners (manuscript roster; HAL is added per-n via hal_by_n) ---
learners:
  - parametric
  - gam
  - lasso
  - knn
  - bart
  - ranger
  - xgboost_naimi
  - sl_default
  - sl_naimi_v2
  - sl_balzer
# The TabPFN v3 API track is run separately in two steps:
#   python/tabpfn_v3_nuisance.py (fits), then
#   Rscript 03_run_ate_estimators.R --learners tabpfn_v3 (estimation).
python_track:
  learner_name: tabpfn_v3
  n_estimators: 8
  random_state: 0

# --- Paths (relative to this directory) ---
paths:
  data_inputs: _data_inputs        # per-sim RDS cache, per sample size
  data_processed: _data_processed  # CSV export for the Python track; nuisance/<learner>/ fits
  results: results
